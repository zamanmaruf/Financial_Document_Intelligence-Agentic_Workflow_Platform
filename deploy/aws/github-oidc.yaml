AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Lets GitHub Actions deploy the DocIntel demo stack without stored AWS keys. GitHub's OIDC
  token is exchanged for a short-lived session on GitHubDeployRole, which can only be assumed
  by jobs running in the repository's protected deployment environment. CloudFormation then
  changes the demo stack's resources with CfnExecutionRole. Deploy once with an admin profile;
  see deploy/aws/RUNBOOK.md ("Continuous deployment").

Parameters:
  GitHubRepository:
    Type: String
    Default: zamanmaruf/Financial_Document_Intelligence-Agentic_Workflow_Platform
    AllowedPattern: "[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+"
    Description: owner/name of the repository whose workflows may deploy.
  GitHubOwnerId:
    Type: String
    Default: "77639071"
    AllowedPattern: "[0-9]+"
    Description: >-
      Numeric ID of the repository owner (https://api.github.com/repos/OWNER/NAME, owner.id).
      GitHub's OIDC subject includes it, so a different account that later takes the same name
      can't match.
  GitHubRepositoryId:
    Type: String
    Default: "1398362139"
    AllowedPattern: "[0-9]+"
    Description: Numeric ID of the repository (the id field of the same API response).
  GitHubEnvironment:
    Type: String
    Default: production
    Description: >-
      GitHub deployment environment the job must run in. Configure it with required reviewers so
      every deploy needs a person's approval.
  DemoStackName:
    Type: String
    Default: docintel-demo
    Description: Name of the demo stack (deploy/aws/demo-stack.yaml) the roles may manage.
  LoadBalancerNamePrefix:
    Type: String
    Default: docint-
    Description: >-
      Prefix CloudFormation gives the demo stack's load balancer and target group names (the
      first six characters of the stack name, then a hyphen).
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      An account can hold only one provider for token.actions.githubusercontent.com. Set to false
      and pass ExistingOidcProviderArn if it already exists.
  ExistingOidcProviderArn:
    Type: String
    Default: ""
    Description: ARN of an existing GitHub OIDC provider (only when CreateOidcProvider is false).

Conditions:
  MakeProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # CloudFormation uses this role to create, change and delete the demo stack's resources.
  # Names CloudFormation generates can't be predicted for EC2 and CloudFront, so those actions
  # are scoped by service; IAM, ECS, ECR, logs, load balancers, SSM and Budgets are scoped to
  # the demo stack's resource names.
  CfnExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: docintel-cfn-exec
      Description: CloudFormation service role for the DocIntel demo stack
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: manage-demo-stack-resources
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Network
                Effect: Allow
                Action:
                  - ec2:Describe*
                  - ec2:GetManagedPrefixListEntries
                  - ec2:CreateVpc
                  - ec2:DeleteVpc
                  - ec2:ModifyVpcAttribute
                  - ec2:CreateSubnet
                  - ec2:DeleteSubnet
                  - ec2:ModifySubnetAttribute
                  - ec2:CreateInternetGateway
                  - ec2:DeleteInternetGateway
                  - ec2:AttachInternetGateway
                  - ec2:DetachInternetGateway
                  - ec2:CreateRouteTable
                  - ec2:DeleteRouteTable
                  - ec2:CreateRoute
                  - ec2:DeleteRoute
                  - ec2:ReplaceRoute
                  - ec2:AssociateRouteTable
                  - ec2:DisassociateRouteTable
                  - ec2:CreateSecurityGroup
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:CreateTags
                  - ec2:DeleteTags
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region
              - Sid: LoadBalancerReads
                Effect: Allow
                Action: elasticloadbalancing:Describe*
                Resource: "*"
              - Sid: LoadBalancer
                Effect: Allow
                Action: elasticloadbalancing:*
                Resource:
                  - !Sub "arn:aws:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:loadbalancer/app/${LoadBalancerNamePrefix}*"
                  - !Sub "arn:aws:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:targetgroup/${LoadBalancerNamePrefix}*"
                  - !Sub "arn:aws:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:listener/app/${LoadBalancerNamePrefix}*"
                  - !Sub "arn:aws:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:listener-rule/app/${LoadBalancerNamePrefix}*"
              - Sid: ContainerReads
                Effect: Allow
                Action:
                  - ecs:Describe*
                  - ecs:List*
                  - ecs:RegisterTaskDefinition
                  - ecs:DeregisterTaskDefinition
                Resource: "*"
              - Sid: Containers
                Effect: Allow
                Action: ecs:*
                Resource:
                  - !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:cluster/${DemoStackName}-*"
                  - !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/${DemoStackName}-*/*"
                  - !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${DemoStackName}:*"
              - Sid: ImageRepository
                Effect: Allow
                Action: ecr:*
                Resource: !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${DemoStackName}-*"
              - Sid: ImageRepositoryCreate
                Effect: Allow
                Action: ecr:CreateRepository
                Resource: "*"
              - Sid: TaskRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:UpdateRoleDescription
                  - iam:UpdateAssumeRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:ListRoleTags
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${DemoStackName}-*"
              - Sid: TaskRoleManagedPolicy
                Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${DemoStackName}-*"
                Condition:
                  ArnEquals:
                    iam:PolicyARN: arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
              - Sid: PassTaskRolesToEcs
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${DemoStackName}-*"
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
              - Sid: ServiceLinkedRoles
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: "*"
                Condition:
                  StringEquals:
                    iam:AWSServiceName:
                      - ecs.amazonaws.com
                      - elasticloadbalancing.amazonaws.com
              - Sid: Logs
                Effect: Allow
                Action: logs:*
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/${DemoStackName}"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/${DemoStackName}:*"
              - Sid: LogReads
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"
              - Sid: Edge
                Effect: Allow
                Action:
                  - cloudfront:Get*
                  - cloudfront:List*
                  - cloudfront:CreateDistribution
                  - cloudfront:UpdateDistribution
                  - cloudfront:DeleteDistribution
                  - cloudfront:CreateResponseHeadersPolicy
                  - cloudfront:UpdateResponseHeadersPolicy
                  - cloudfront:DeleteResponseHeadersPolicy
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                Resource: "*"
              - Sid: Secrets
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/docintel/demo/*"
              - Sid: Budget
                Effect: Allow
                Action:
                  - budgets:ViewBudget
                  - budgets:ModifyBudget
                  - budgets:TagResource
                  - budgets:UntagResource
                  - budgets:ListTagsForResource
                Resource: !Sub "arn:aws:budgets::${AWS::AccountId}:budget/${DemoStackName}-monthly*"

  # The GitHub Actions job assumes this role. It can change only the demo stack, and only by
  # handing CloudFormation the execution role above; it can't create resources directly.
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: docintel-github-deploy
      Description: Assumed by the GitHub Actions deploy job through OIDC
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub
                  - "repo:${Owner}@${GitHubOwnerId}/${Name}@${GitHubRepositoryId}:environment:${GitHubEnvironment}"
                  - Owner: !Select [0, !Split ["/", !Ref GitHubRepository]]
                    Name: !Select [1, !Split ["/", !Ref GitHubRepository]]
      Policies:
        - PolicyName: deploy-demo-stack
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ChangeDemoStackThroughServiceRole
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${DemoStackName}/*"
                Condition:
                  StringEquals:
                    cloudformation:RoleArn: !GetAtt CfnExecutionRole.Arn
              - Sid: DemoStack
                Effect: Allow
                Action:
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:ListChangeSets
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplateSummary
                Resource: !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${DemoStackName}/*"
              - Sid: TemplateChecks
                Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - cloudformation:GetTemplateSummary
                Resource: "*"
              - Sid: HandOverServiceRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CfnExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Sid: PushImage
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${DemoStackName}-*"
              - Sid: RegistryLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: ReadDeployParameters
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/docintel/demo/*"
              - Sid: SmokeChecks
                Effect: Allow
                Action:
                  - ec2:DescribeManagedPrefixLists
                  - ecs:DescribeServices
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeTargetHealth
                Resource: "*"
              - Sid: SmokeLogs
                Effect: Allow
                Action: logs:FilterLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/${DemoStackName}:*"

Outputs:
  DeployRoleArn:
    Description: Set as the AWS_DEPLOY_ROLE_ARN variable of the GitHub environment
    Value: !GetAtt GitHubDeployRole.Arn
  CfnExecutionRoleArn:
    Description: Set as the AWS_CFN_ROLE_ARN variable of the GitHub environment
    Value: !GetAtt CfnExecutionRole.Arn

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Everything in CI runs offline against the deterministic mock provider: no paid APIs, no
  # cloud credentials. Deployment and the live smoke tests run in deploy.yml after CI passes.
  DOCINTEL_LLM_PROVIDER: mock
  DOCINTEL_EMBEDDING_PROVIDER: hashing
  DOCINTEL_LOG_JSON: "false"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock

      - name: Install system packages (OCR)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check app scripts tests

      - name: Format check
        run: ruff format --check app scripts tests

      - name: Type check
        run: mypy app

      - name: Unit tests
        run: pytest tests/unit -q

      - name: Integration tests
        run: pytest tests/integration -q

      - name: End-to-end API tests
        run: pytest tests/e2e -q

      - name: Offline evaluation
        run: python scripts/run_evals.py --output reports/eval_results.json

      - name: Quality gate (thresholds + regression vs baseline)
        run: python scripts/quality_gate.py reports/eval_results.json

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: reports/eval_results.json
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload site build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint CloudFormation templates
        run: |
          pip install cfn-lint
          cfn-lint deploy/aws/demo-stack.yaml deploy/aws/github-oidc.yaml

      - name: Check deploy script syntax (deploy, smoke)
        run: bash -n deploy/aws/deploy.sh && bash -n deploy/aws/smoke.sh

      - name: Lint GitHub Actions workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  e2e:
    runs-on: ubuntu-latest
    needs: web
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install API
        run: pip install -r requirements.lock

      - name: Install web
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Download site build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Browser tests (guided tour, accessibility, mobile)
        working-directory: web
        env:
          PYTHON: python
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    needs: [quality, web]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t fin-docintel:ci .

      - name: Smoke test container
        run: |
          docker run -d --name api -p 8000:8000 \
            -e DOCINTEL_DEMO_MODE=true \
            -e DOCINTEL_DEMO_SECRET="$(openssl rand -hex 32)" \
            fin-docintel:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8000/ | grep -q '<div id="root">'
          curl -fsSI http://127.0.0.1:8000/tour | grep -qi "content-security-policy"
          curl -fsS http://127.0.0.1:8000/ui/ | grep -qi "<html"

      - name: Container logs
        if: always()
        run: docker logs api || true

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fin-docintel"
version = "0.1.0"
description = "Financial Document Intelligence & Agentic Workflow Platform: ingestion, classification, extraction, validation, RAG with citations, HITL review, evaluation, observability."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30,<2.1",
    "pypdf>=6.19,<7",
    "pypdfium2>=4.30",
    "pillow>=10.4",
    "pytesseract>=0.3.13",
    "pyyaml>=6.0",
    "chromadb>=1.0,<2",
    "langchain-core>=1.2.22,<2",
    "langchain-text-splitters>=1.1.2,<2",
    "langchain-aws>=1.0,<2",
    "langchain-openai>=1.1.14,<2",
    "boto3>=1.35",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "reportlab>=4.2",
]
# Optional LlamaIndex retrieval engine (DOCINTEL_RAG_ENGINE=llamaindex); not in the Docker image.
llamaindex = [
    "llama-index-core>=0.14,<0.15",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.web" = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "N", "C4", "PL"]
ignore = [
    "PLR0913",  # many-args is common for service constructors with DI
    "PLR0917",
    "PLR2004",  # magic values are fine in tests/metrics
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "S101",     # asserts in tests
    "RUF012",
    "PLC0415",  # local imports used deliberately for optional SDKs
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "N802", "B017"]
"scripts/**" = ["S", "T201", "PLR"]
"evals/**" = ["S", "T201"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
exclude = ["tests/", "scripts/"]

[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "pytesseract.*",
    "pypdfium2.*",
    "boto3.*",
    "botocore.*",
    "langchain_aws.*",
    "langchain_openai.*",
    "reportlab.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated tests",
    "integration: multi-component tests without external credentials",
    "e2e: full API workflow tests in mock mode",
    "requires_tesseract: needs the tesseract binary",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
